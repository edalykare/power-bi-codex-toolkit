[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "power-bi-codex-toolkit"
version = "0.1.0"
description = "Codex skills and offline checks for Power BI and Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "ATTRIBUTIONS.md"]
authors = [{name = "power-bi-codex-toolkit contributors"}]
keywords = ["codex", "power-bi", "fabric", "dax", "tmdl", "pbip"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.1", "PyYAML==6.0.3", "build==1.3.0", "jsonschema==4.25.1"]

[project.scripts]
pbi-codex = "pbi_codex.cli:main"

[project.urls]
Repository = "https://github.com/edalykare/power-bi-codex-toolkit"
Issues = "https://github.com/edalykare/power-bi-codex-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
